  <!-- Column details -->
  <line x1="307" y1="200" x2="307" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="357" y1="200" x2="357" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="442" y1="200" x2="442" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
