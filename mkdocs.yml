# MkDocs 配置文件 - 文化遗产保护与利用

site_name: 文化遗产保护与利用
site_url: https://stonetuo-svg.github.io/cultural-heritage-conservation/
site_description: 文化遗产保护与利用 - 华南理工大学设计学院
site_author: 华南理工大学设计学院

repo_name: cultural-heritage-conservation
repo_url: https://github.com/stonetuo-svg/cultural-heritage-conservation

# Material 主题配置
theme:
  name: material
  language: zh
  
  # 配色方案
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

  # 字体
  font:
    text: Roboto
    code: Roboto Mono

# 功能特性
plugins:
  - search:
      lang:
        - zh
        - en
      prebuild_index: true

# 导航结构
nav:
  - 第一章 文化遗产概述:
      - 概述: chapters/chapter1
      - 1.1 概念界定: chapters/1-1
      - 1.2 价值体系: chapters/1-2
      - 1.3 国际保护体系: chapters/1-3
      - 1.4 中国保护制度: chapters/1-4
      - 1.5 时代背景: chapters/1-5
  - 第二章 保护发展历程:
      - 概述: chapters/chapter2
      - 2.1 国际发展历程: chapters/2-1
      - 2.2 中国发展历程: chapters/2-2
      - 2.3 基本原则: chapters/2-3
      - 2.4 主要方法: chapters/2-4
  - 第三章 聚落文化遗产:
      - 概述: chapters/chapter3
      - 3.1 认知基础: chapters/3-1
      - 3.2 保护原则: chapters/3-2
      - 3.3 保护实践: chapters/3-3
      - 3.4 更新利用: chapters/3-4
      - 3.5 制度保障: chapters/3-5
  - 第四章 建筑文化遗产:
      - 概述: chapters/chapter4
      - 4.1 概念与类型: chapters/4-1
      - 4.2 保护技术: chapters/4-2
      - 4.3 保护管理: chapters/4-3
      - 4.4 活化利用: chapters/4-4
      - 4.5 与城市更新: chapters/4-5
  - 第五章 产业文化遗产:
      - 概述: chapters/chapter5
      - 5.1 概述: chapters/5-1
      - 5.2 农业遗产: chapters/5-2
      - 5.3 工业遗产: chapters/5-3
      - 5.4 手工业遗产: chapters/5-4
      - 5.5 交通水利遗产: chapters/5-5
      - 5.6 商业服务遗产: chapters/5-6
  - 第六章 可移动文物:
      - 概述: chapters/chapter6
      - 6.1 概念与类型: chapters/6-1
      - 6.2 保护与展示体系: chapters/6-2
      - 6.3 分类与特征: chapters/6-3
      - 6.4 调查与认定: chapters/6-4
      - 6.5 保护技术: chapters/6-5
      - 6.6 展示与传播: chapters/6-6
  - 第七章 非物质文化遗产:
      - 概述: chapters/chapter7
      - 7.1 概念与特征: chapters/7-1
      - 7.2 保护原则: chapters/7-2
      - 7.3 保护措施: chapters/7-3
      - 7.4 传承与发展: chapters/7-4
      - 7.5 数字化保护: chapters/7-5
  - 案例库:
      - 案例库首页: cases/index
      - 聚落案例: cases/settlement
      - 建筑案例: cases/architecture
      - 非遗案例: cases/intangible
      - 产业案例: cases/industry
      - 民俗案例: cases/folklore
  - 关于: about

# Markdown 扩展
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

# 额外 CSS 和 JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/javascripts/interactive.js

# 社交链接
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stonetuo-svg/cultural-heritage-conservation
  generator: false

# 版权
copyright: Copyright &copy; 2026 华南理工大学设计学院
