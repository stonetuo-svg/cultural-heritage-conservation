<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#7A8A9A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g5)"/>
  <!-- Factory/industrial silhouette -->
  <g fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <rect x="100" y="200" width="150" height="200"/>
    <rect x="260" y="180" width="120" height="220"/>
    <rect x="390" y="160" width="90" height="240"/>
    <rect x="490" y="220" width="180" height="180"/>
    <!-- Windows -->
    <rect x="130" y="230" width="30" height="40" fill="rgba(255,255,255,0.08)"/>
    <rect x="180" y="230" width="30" height="40" fill="rgba(255,255,255,0.08)"/>
    <rect x="280" y="210" width="30" height="50" fill="rgba(255,255,255,0.08)"/>
    <rect x="320" y="210" width="30" height="50" fill="rgba(255,255,255,0.08)"/>
    <rect x="410" y="190" width="25" height="35" fill="rgba(255,255,255,0.08)"/>
    <rect x="520" y="250" width="40" height="40" fill="rgba(255,255,255,0.08)"/>
    <rect x="580" y="250" width="40" height="40" fill="rgba(255,255,255,0.08)"/>
  </g>
  <!-- Chimney -->
  <rect x="150" y="100" width="25" height="100" fill="rgba(255,255,255,0.1)"/>
  <rect x="550" y="120" width="20" height="100" fill="rgba(255,255,255,0.1)"/>
  <!-- Gear icon -->
  <g transform="translate(650, 120)" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <circle cx="0" cy="0" r="25"/>
    <circle cx="0" cy="0" r="15"/>
    <line x1="0" y1="-30" x2="0" y2="-20"/>
    <line x1="0" y2="30" x2="0" y2="20"/>
    <line x1="-30" y1="0" x2="-20" y2="0"/>
    <line x1="30" y1="0" x2="20" y2="0"/>
  </g>
</svg>
