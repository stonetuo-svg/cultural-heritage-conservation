<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E5F3E"/>
      <stop offset="100%" stop-color="#5A8F6A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g2)"/>
  <!-- Traditional village rooftops -->
  <g fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <polygon points="100,280 200,180 300,280"/>
    <polygon points="250,300 350,210 450,300"/>
    <polygon points="400,270 500,170 600,270"/>
    <polygon points="550,290 640,200 730,290"/>
    <rect x="120" y="280" width="160" height="120" fill="rgba(255,255,255,0.08)"/>
    <rect x="270" y="300" width="160" height="100" fill="rgba(255,255,255,0.06)"/>
    <rect x="420" y="270" width="160" height="130" fill="rgba(255,255,255,0.08)"/>
    <rect x="570" y="290" width="140" height="110" fill="rgba(255,255,255,0.06)"/>
  </g>
  <!-- Ground line -->
  <line x1="0" y1="400" x2="800" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
</svg>
